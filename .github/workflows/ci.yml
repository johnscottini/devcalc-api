name: CI Pipeline

permissions:
  issues: write


on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Executar testes unitários?'
        required: true
        default: 'true'
        type: boolean
      run_lint:
        description: 'Executar análise SonarCloud (Lint)?'
        required: true
        default: 'true'
        type: boolean

  push:
    branches:
      - main

jobs:
  run-tests:
    name: Testes Unitários
    if: ${{ inputs.run_tests == 'true' || github.event_name != 'workflow_dispatch' }}
    uses: ./.github/workflows/unit-test.yml

  lint:
    name: Análise SonarCloud (Lint)
    runs-on: ubuntu-latest
    if: ${{ inputs.run_lint == 'true' || github.event_name != 'workflow_dispatch' }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configurar Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build e análise SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.organization=jonathan-scottini \
          -Dsonar.projectKey=johnscottini_devcalc-api \
          -Dsonar.branch.name=main

  package:
    name: Gerar pacote .jar
    runs-on: ubuntu-latest
    needs: [run-tests, lint]
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Gerar .jar com Maven
        run: mvn package -DskipTests

  deploy:
    name: ${{ vars.DEPLOYNAME }}
    runs-on: ${{ vars.RUNSON }}
    needs: package
    steps:
      - name: Verificar se variável DEPLOYNAME está definida
        id: check_deployname
        run: |
          if [ -z "${{ vars.DEPLOYNAME }}" ]; then
            echo "missing=true" >> $GITHUB_OUTPUT
          else
            echo "missing=false" >> $GITHUB_OUTPUT
          fi

      - name: Criar issue se DEPLOYNAME estiver ausente
        if: steps.check_deployname.outputs.missing == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -X POST https://api.github.com/repos/${{ github.repository }}/issues \
          -H "Authorization: token $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github.v3+json" \
          -d '{
            "title": "Variável DEPLOYNAME não está definida",
            "body": "O workflow falhou ao tentar executar o deploy porque a variável `DEPLOYNAME` está ausente. Por favor, verifique as variáveis de ambiente definidas.",
            "labels": ["bug", "ci"]
          }'
      - name: Exibir mensagem de deploy
        run: echo "Deploy realizado com sucesso"