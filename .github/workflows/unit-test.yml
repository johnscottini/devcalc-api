name: Unit Test Workflow

on:
  workflow_call:

jobs:
  unit-tests:
    name: Executar Testes Unitários
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Executar Testes Unitários
        run: mvn test